
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Generator | LearnMitra-AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>LearnMitra-AI</h2>
        <a href="index.html">Home</a>
<a href="translator.html">Translator</a>
<a href="assistant.html">Learning Assistant</a>
<a href="quiz.html">Quiz</a>
<a href="chat.html">Chatbot</a>
<a href="history.html">Learning History</a>
    </nav>

    <section class="translator-container">

        <h1>AI Quiz Generator</h1>
        <p>Test your knowledge with AI-generated quizzes.</p>

        <label for="topic">Enter Topic</label>
        <input
            type="text"
            id="topic"
            placeholder="Example: Photosynthesis"
        >

        <label for="language">Select Language</label>
        <select id="language">
            <option value="English">English</option>
            <option value="Telugu">Telugu</option>
            <option value="Tamil">Tamil</option>
            <option value="Hindi">Hindi</option>
            <option value="Kannada">Kannada</option>
        </select>

        <button onclick="generateQuiz()">
            Generate Quiz
        </button>

        <div id="quiz-result">
            <h3>Your Quiz</h3>
            <div id="questions">
                Your questions will appear here.
            </div>
        </div>

    </section>

    <script src="quiz.js"></script>

</body>
</html>
